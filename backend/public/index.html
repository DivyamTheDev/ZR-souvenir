<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Z&R Finance Admin Dashboard</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f7f6; padding: 2rem; }
        .card { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 800px; margin: auto; margin-bottom: 20px;}
        input, button, select { width: 100%; padding: 10px; margin: 10px 0; border-radius: 5px; border: 1px solid #ccc; box-sizing: border-box; }
        button { background: #2c3e50; color: white; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background: #34495e; }
        #dashboard { display: none; }
        .stat-container { display: flex; gap: 10px; }
        .stat-box { flex: 1; background: #ecf0f1; padding: 15px; text-align: center; border-radius: 5px; font-size: 1.2rem; }
        .income { color: #27ae60; font-weight: bold;}
        .expense { color: #e74c3c; font-weight: bold;}
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #2c3e50; color: white; }
        .action-btn { padding: 5px; margin: 2px; width: auto; font-size: 0.8rem; }
        .del-btn { background: #e74c3c; }
        .upd-btn { background: #f39c12; }
    </style>
</head>
<body>

<div class="card" id="login-section">
    <h2>Z&R Finance - Admin Login</h2>
    <p>Sign in to view financial records.</p>
    <input type="text" id="username" placeholder="Username (default: admin)" value="admin">
    <input type="password" id="password" placeholder="Password (default: admin123)" value="admin123">
    <button onclick="login()">Access Dashboard</button>
    <div id="login-error" style="color: red;"></div>
</div>

<div id="dashboard">
    <div class="card">
        <h2>Z&R Dashboard Summary</h2>
        <p>Logged in as: <span id="user-role" style="font-weight: bold;"></span></p>
        
        <div class="stat-container">
            <div class="stat-box income">Income: $<span id="t-income">0</span></div>
            <div class="stat-box expense">Expense: $<span id="t-expense">0</span></div>
            <div class="stat-box" style="font-weight: bold;">Net: $<span id="t-net">0</span></div>
        </div>
        <button onclick="logout()" style="background: #e74c3c; margin-top: 20px;">Logout</button>
    </div>

    <!-- Add Record -->
    <div class="card">
        <h3>Create Transaction</h3>
        <div style="display:flex; gap:10px;">
            <input type="number" id="amt" placeholder="Amount (e.g. 150)">
            <select id="type">
                <option value="INCOME">Income (Sale)</option>
                <option value="EXPENSE">Expense (Cost)</option>
            </select>
        </div>
        <div style="display:flex; gap:10px;">
            <input type="text" id="cat" placeholder="Category">
            <button onclick="addTransaction()">Submit</button>
        </div>
    </div>

    <!-- Ledger & Filtering -->
    <div class="card">
        <h3>Financial Ledger (Read, Update, Delete, Filter)</h3>
        <div style="display:flex; gap:10px; background: #eee; padding:10px; border-radius: 5px;">
            <select id="filterType">
                <option value="">All Types</option>
                <option value="INCOME">Income Only</option>
                <option value="EXPENSE">Expense Only</option>
            </select>
            <input type="text" id="filterCat" placeholder="Filter by category">
            <button onclick="fetchLedger()">Apply Filter</button>
        </div>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Type</th>
                    <th>Amount</th>
                    <th>Category</th>
                    <th>Date</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="ledger-body">
                <!-- Rows dynamically injected -->
            </tbody>
        </table>
    </div>
</div>

<script>
    let currentToken = '';

    async function login() {
        const user = document.getElementById('username').value;
        const pass = document.getElementById('password').value;
        const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: user, password: pass })
        });
        const data = await res.json();
        
        if (res.ok) {
            currentToken = data.token;
            document.getElementById('login-section').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
            document.getElementById('user-role').innerText = data.role;
            
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
            
            fetchSummary();
            fetchLedger();
        } else {
            document.getElementById('login-error').innerText = "Login Failed: " + data.error;
        }
    }

    function logout() {
        currentToken = '';
        document.getElementById('login-section').style.display = 'block';
        document.getElementById('dashboard').style.display = 'none';
        document.getElementById('login-error').innerText = '';
    }

    // Refresh Data APIs
    function refreshAll() {
        fetchSummary();
        fetchLedger();
    }

    async function fetchSummary() {
        if (!currentToken) return;
        const res = await fetch('/api/dashboard/summary', {
            headers: { 'Authorization': `Bearer ${currentToken}` }
        });
        const data = await res.json();
        if (res.ok) {
            document.getElementById('t-income').innerText = data.totalIncome || 0;
            document.getElementById('t-expense').innerText = data.totalExpense || 0;
            document.getElementById('t-net').innerText = data.netBalance || 0;
        }
    }

    async function fetchLedger() {
        if (!currentToken) return;
        const filterType = document.getElementById('filterType').value;
        const filterCat = document.getElementById('filterCat').value;
        
        let url = '/api/transactions?';
        if (filterType) url += `type=${filterType}&`;
        if (filterCat) url += `category=${filterCat}&`;

        const res = await fetch(url, { headers: { 'Authorization': `Bearer ${currentToken}` } });
        const data = await res.json();
        
        const tbody = document.getElementById('ledger-body');
        tbody.innerHTML = '';
        
        if (res.ok) {
            data.forEach(t => {
                tbody.innerHTML += `
                <tr>
                    <td>${t.id}</td>
                    <td style="color: ${t.type === 'INCOME' ? 'green' : 'red'}; font-weight:bold;">${t.type}</td>
                    <td>$${t.amount}</td>
                    <td>${t.category}</td>
                    <td>${t.date}</td>
                    <td>
                        <button class="action-btn upd-btn" onclick="updateRecord(${t.id}, '${t.type}', '${t.category}', ${t.amount})">Update</button>
                        <button class="action-btn del-btn" onclick="deleteRecord(${t.id})">Delete</button>
                    </td>
                </tr>`;
            });
        }
    }

    async function addTransaction() {
        const amt = document.getElementById('amt').value;
        const type = document.getElementById('type').value;
        const cat = document.getElementById('cat').value;
        if(!amt || !cat) return alert("Amount and category required!");
        
        const res = await fetch('/api/transactions', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${currentToken}` },
            body: JSON.stringify({ amount: parseFloat(amt), type: type, category: cat, date: new Date().toISOString().slice(0, 10), description: "Test" })
        });
        
        if(!res.ok) {
            const err = await res.json();
            alert("Error: " + err.error);
        } else {
            document.getElementById('amt').value = '';
            document.getElementById('cat').value = '';
            refreshAll(); 
        }
    }

    async function updateRecord(id, oldType, oldCat, oldAmt) {
        const newAmt = prompt("Update Amount:", oldAmt);
        if(newAmt === null) return;
        const res = await fetch('/api/transactions/' + id, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${currentToken}` },
            body: JSON.stringify({ amount: parseFloat(newAmt), type: oldType, category: oldCat, date: new Date().toISOString().slice(0, 10), description: "Updated" })
        });
        
        if(!res.ok) {
            const err = await res.json();
            alert("Update Failed: " + err.error);
        } else {
            refreshAll();
        }
    }

    async function deleteRecord(id) {
        if(!confirm(`Are you sure you want to delete transaction #${id}?`)) return;
        const res = await fetch('/api/transactions/' + id, {
            method: 'DELETE',
            headers: { 'Authorization': `Bearer ${currentToken}` }
        });
        
        if(!res.ok) {
            const err = await res.json();
            alert("Delete Failed: " + err.error);
        } else {
            refreshAll();
        }
    }

</script>

</body>
</html>
